---
- name: Setup Tencent Hub (Docker, Nginx, Portainer)
  hosts: hub
  become: yes # Bertindak sebagai root (sudo)

  vars_files:
    - secrets.yml # File rahasia yang dienkripsi Ansible Vault

  vars:
    portainer_port: 9000
    npm_port: 8181
    prometheus_port: 9090
    grafana_port: 3000
    monitoring_dir: /opt/monitoring

  tasks:
    - name: 1. Update apt cache & Install dependencies dasar
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: 2. Tambahkan GPG Key resmi Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 3. Tambahkan Repositori Docker
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: 4. Install Docker dan kawan-kawannya
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-docker # Syarat wajib untuk memakai modul Ansible Docker
        state: present

    - name: 5. Pastikan Docker otomatis menyala saat server restart
      systemd:
        name: docker
        state: started
        enabled: yes

    # Catatan: Untuk Portainer & Nginx, di tahap pemula kita bisa pakai command biasa dulu
    - name: 6. Buat Docker Network (proxy-network)
      command: docker network create proxy-network
      ignore_errors: yes # Abaikan jika network sudah pernah terbuat sebelumnya

    - name: 7. Jalankan Portainer Container
      command: >
        docker run -d -p 127.0.0.1:{{ portainer_port }}:9000 --name portainer
        --network proxy-network --restart=always
        -v /var/run/docker.sock:/var/run/docker.sock
        -v portainer_data:/data portainer/portainer-ce:latest
      ignore_errors: yes

    - name: 8a. Hapus Nginx Container lama (agar port bisa di-update)
      command: docker rm -f nginx-proxy-manager
      ignore_errors: yes

    - name: 8b. Jalankan Nginx Proxy Manager Container (Port {{ npm_port }})
      command: >
        docker run -d -p 80:80 -p 443:443 -p 127.0.0.1:{{ npm_port }}:81
        --name nginx-proxy-manager --network proxy-network --restart=always
        -v npm_data:/data -v npm_letsencrypt:/etc/letsencrypt
        jc21/nginx-proxy-manager:latest
      ignore_errors: yes

    - name: 9. Buat Folder Monitoring
      file:
        path: '{{ monitoring_dir }}'
        state: directory

    - name: 10. Injeksi file konfigurasi prometheus.yml
      copy:
        dest: '{{ monitoring_dir }}/prometheus.yml'
        content: |
          global:
            scrape_interval: 10s
          scrape_configs:
            - job_name: 'tencent_hub'
              static_configs:
                - targets: ['node-exporter:9100']
      notify: Restart Prometheus

    - name: 11. Jalankan Node Exporter (Modul Elegan)
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: always
        networks:
          - name: proxy-network

    - name: 12. Jalankan Prometheus (Modul Elegan)
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        networks:
          - name: proxy-network
        published_ports:
          - '127.0.0.1:{{ prometheus_port }}:9090'
        volumes:
          - '{{ monitoring_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml'

    - name: 13. Jalankan Grafana (Modul Elegan)
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        networks:
          - name: proxy-network
        published_ports:
          - '127.0.0.1:{{ grafana_port }}:3000'
        env:
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"

  handlers:
    - name: Restart Prometheus
      community.docker.docker_container:
        name: prometheus
        state: started
        restart: yes
