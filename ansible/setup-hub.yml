---
- name: Setup Tencent Hub (Docker, Nginx, Portainer)
  hosts: hub
  become: yes # Bertindak sebagai root (sudo)

  tasks:
    - name: 1. Update apt cache & Install dependencies dasar
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: 2. Tambahkan GPG Key resmi Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 3. Tambahkan Repositori Docker
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: 4. Install Docker dan kawan-kawannya
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: 5. Pastikan Docker otomatis menyala saat server restart
      systemd:
        name: docker
        state: started
        enabled: yes

    # Catatan: Untuk Portainer & Nginx, di tahap pemula kita bisa pakai command biasa dulu
    - name: 6. Buat Docker Network (proxy-network)
      command: docker network create proxy-network
      ignore_errors: yes # Abaikan jika network sudah pernah terbuat sebelumnya

    - name: 7. Jalankan Portainer Container
      command: >
        docker run -d -p 127.0.0.1:9000:9000 --name portainer
        --network proxy-network --restart=always
        -v /var/run/docker.sock:/var/run/docker.sock
        -v portainer_data:/data portainer/portainer-ce:latest
      ignore_errors: yes

    - name: 8a. Hapus Nginx Container lama (agar port bisa di-update)
      command: docker rm -f nginx-proxy-manager
      ignore_errors: yes

    - name: 8b. Jalankan Nginx Proxy Manager Container (Port 8181)
      command: >
        docker run -d -p 80:80 -p 443:443 -p 127.0.0.1:8181:81
        --name nginx-proxy-manager --network proxy-network --restart=always
        -v npm_data:/data -v npm_letsencrypt:/etc/letsencrypt
        jc21/nginx-proxy-manager:latest
      ignore_errors: yes
