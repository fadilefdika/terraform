---
- name: Setup Tencent Hub (Docker, Nginx, Portainer)
  hosts: "{{ target | default('staging') }}"
  become: yes # Bertindak sebagai root (sudo)

  vars_files:
    - secrets.yml # File rahasia yang dienkripsi Ansible Vault

  vars:
    portainer_port: 9000
    npm_port: 8181
    prometheus_port: 9090
    grafana_port: 3000
    monitoring_dir: /opt/monitoring

  tasks:
    - name: 1.1 Atur Zona Waktu (Timezone) ke Asia/Jakarta
      timezone:
        name: Asia/Jakarta

    - name: 1.2 Matikan Fitur Login Password SSH (Security Hardening)
      copy:
        dest: /etc/ssh/sshd_config.d/01-hardening.conf # 01 supaya dibaca lebih dulu
        content: |
          PasswordAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: sshd -t -f %s # cek sintaks sebelum diterapkan
      notify: Restart SSH

    - name: 1.25 Bersihkan repo Docker lama yang menyebabkan konflik APT
      shell: rm -f /etc/apt/sources.list.d/*docker* /etc/apt/sources.list.d/archive_uri-https_download_docker_com*
      ignore_errors: yes

    - name: 1.3 Update apt cache & Install dependencies dan alat bantu
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - htop
          - git
          - vim
          - ufw
        state: present
        update_cache: yes
    - name: 1.4 UFW izinkan SSH, HTTP, HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: 1.5 Aktifkan UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
    - name: 2. Buat folder keyrings apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: 2.5 Unduh GPG key Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Hapus repo Docker lama (tanpa signed-by)
      file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: 3. Tambah repo Docker (Modern)
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: 4. Install Docker dan kawan-kawannya
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-docker # Syarat wajib untuk memakai modul Ansible Docker
        state: present

    - name: 5. Pastikan Docker otomatis menyala saat server restart
      systemd:
        name: docker
        state: started
        enabled: yes

    # Catatan: Di-refactor ke Micro-segmentation (3 Network Terpisah)
    - name: 6. Buat Docker Networks Terisolasi
      community.docker.docker_network:
        name: "{{ item }}"
      loop:
        - proxy-net
        - monitoring-net
        - management-net

    - name: 7. Jalankan Portainer
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: started
        restart_policy: always
        purge_networks: yes
        networks:
          - name: management-net
        published_ports:
          - "127.0.0.1:{{portainer_port}}:9000"
        volumes:
          - portainer_data:/data
          - /var/run/docker.sock:/var/run/docker.sock

    - name: 8. Jalankan Nginx Proxy Manager Container
      community.docker.docker_container:
        name: nginx-proxy-manager
        image: jc21/nginx-proxy-manager:latest
        state: started
        restart_policy: always
        purge_networks: yes
        security_opts:
          - "no-new-privileges:true"
        cap_drop:
          - NET_RAW
        networks:
          - name: proxy-net
        published_ports:
          - "127.0.0.1:{{ npm_port }}:81"
          - "80:80"
          - "443:443"
        volumes:
          - npm_data:/data
          - npm_letsencrypt:/etc/letsencrypt

    - name: 9. Buat Folder Monitoring
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/grafana/provisioning/datasources"

    - name: 10. Injeksi file konfigurasi prometheus.yml
      copy:
        dest: "{{ monitoring_dir }}/prometheus.yml"
        content: |
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]
            - job_name: cadvisor
              static_configs:
                - targets: ["cadvisor:8080"]
      notify: Restart Prometheus

    - name: 10.5 Injeksi file Grafana Datasource
      copy:
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true

    - name: 11. Jalankan Node Exporter (Monitoring Net)
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: always
        purge_networks: yes
        command:
          - --path.rootfs=/host
        volumes:
          - "/:/host:ro,rslave"
        networks:
          - name: monitoring-net

    - name: 11.5 Jalankan cAdvisor (Monitoring Net)
      community.docker.docker_container:
        name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        state: started
        restart_policy: always
        purge_networks: yes
        memory: 128m
        command:
          - --docker_only=true
          - --housekeeping_interval=30s
        volumes:
          - "/:/rootfs:ro"
          - "/var/run:/var/run:ro"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"
        networks:
          - name: monitoring-net

    - name: 12. Jalankan Prometheus (Monitoring Net)
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        purge_networks: yes
        memory: 256m
        command:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.retention.time=7d
          - --storage.tsdb.retention.size=2GB
        networks:
          - name: monitoring-net
        published_ports:
          - "127.0.0.1:{{ prometheus_port }}:9090"
        volumes:
          - "{{ monitoring_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"
          - prometheus_data:/prometheus

    - name: 13. Jalankan Grafana (Monitoring Net)
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:11.1.0
        state: started
        restart_policy: always
        purge_networks: yes
        memory: 256m
        networks:
          - name: monitoring-net
        published_ports:
          - "127.0.0.1:{{ grafana_port }}:3000"
        env:
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
          GF_SMTP_ENABLED: "true"
          GF_SMTP_HOST: "smtp.gmail.com:587"
          GF_SMTP_USER: "alamat@gmail.com"
          GF_SMTP_PASSWORD: "{{ grafana_smtp_app_password }}"
          GF_SMTP_FROM_ADDRESS: "alamat@gmail.com"
          GF_SMTP_FROM_NAME: "VPS Grafana Alert"
          GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
        volumes:
          - grafana_data:/var/lib/grafana
          - "{{ monitoring_dir }}/grafana/provisioning:/etc/grafana/provisioning"
      no_log: true

  handlers:
    - name: Restart Prometheus
      community.docker.docker_container:
        name: prometheus
        state: started
        restart: yes

    - name: Restart SSH
      service:
        name: sshd
        state: restarted
